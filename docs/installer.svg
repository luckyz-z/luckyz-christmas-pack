<text x="28" y="254" xml:space="preserve" fill="#e04b57">  L U C K Y Z   C H R I S T M A S   P A C K</text>
<text x="28" y="276" xml:space="preserve" fill="#e7bf5a">  * 38 days until Christmas *</text>
<text x="28" y="298" xml:space="preserve" fill="#e04b57">  ========================================================</text>
<text x="28" y="320" xml:space="preserve" fill="#fff4e0"></text>
<text x="28" y="342" xml:space="preserve" fill="#7fd8d8">  Pick your presents</text>
<text x="28" y="364" xml:space="preserve" fill="#35b070">   [x] 1  Windows Terminal: snow background, Christmas colors</text>
<text x="28" y="386" xml:space="preserve" fill="#35b070">   [x] 2  Taskbar lights: string lights and snow drift</text>
<text x="28" y="408" xml:space="preserve" fill="#6b7a72">   [ ] 3  Transparent taskbar (installs TranslucentTB)</text>
<text x="28" y="430" xml:space="preserve" fill="#35b070">   [x] 4  Spotify now-playing desktop widget</text>
<text x="28" y="452" xml:space="preserve" fill="#35b070">   [x] 5  VS Code: Christmas theme and file icons</text>
<text x="28" y="474" xml:space="preserve" fill="#35b070">   [x] 6  Spotify: Christmas theme and snow</text>
<text x="28" y="496" xml:space="preserve" fill="#35b070">   [x] 7  Discord: Christmas theme (uses Vencord)</text>
<text x="28" y="518" xml:space="preserve" fill="#6b7a72">   [ ] 8  Corsair iCUE: Christmas lighting</text>
<text x="28" y="540" xml:space="preserve" fill="#fff4e0"></text>
<text x="28" y="562" xml:space="preserve" fill="#e7bf5a">  Type numbers to toggle (like 2,5), A = all, N = none, Enter = unwrap:</text>
